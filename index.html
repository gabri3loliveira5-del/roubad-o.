<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roubadão AI</title>
</head>

<body>

  <h1>Roubadão AI</h1>

  <p>Seu assistente de programação</p>

  <textarea id="pedido" placeholder="Digite sua ideia..."></textarea>

  <br><br>

  <button onclick="gerar()">Gerar código</button>

  <p id="resultado"></p>

  <script>
    function gerar() {
      const pedido = document.getElementById("pedido").value;

      document.getElementById("resultado").textContent =
        "Pedido recebido: " + pedido;
    }
  </script>

</body>
</html>
